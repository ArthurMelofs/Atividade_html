<!DOCTYPE html>
<html lang="pt">
    <head>
       <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro</title>
        <link rel="stylesheet" href="cadastro.css"> 
    </head>
    <body>

        <center>
            <div id="N">
                <center>

                <h1><font size="8%">Cadastro</font></h1>

                <br><br>

                <center>
                <label class="nome" for="nome">Nome:</label>
                <input type="text" class="O" placeholder="Digite seu nome">
                </center>

                <br>

                <center>
                <label class="email" for="email">E-mail:</label>
                <input type="text" class="E" placeholder="Digite seu email">
                </center>

                <br>

                <label class="senha" for="senha">Senha:</label>
                <input type="password" class="S" placeholder="Crie uma senha">

                <br><br>

                <label class="csenha" for="csenha">Confirme sua senha:</label>
                <input type="password" class="CS" placeholder="Confirmar senha">

                <br><br><br>

                <center>
                <button class="proximo" type="button">Próximo</button>
                </center>

                </center>
            </div>
        </center>
    </body>
</html>
